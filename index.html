<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Arsenal Music</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #feffda;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    h1 {
        color: #586000;
        margin-top: 20px;
    }

    .box {
        background: white;
        width: 60%;
        margin: 20px auto;
        padding: 20px;
        border-radius: 10px;
    }

    input, select {
        width: 80%;
        padding: 8px;
        margin: 5px 0;
    }

    button {
        padding: 10px 20px;
        background: #585000;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #007a40;
    }

    .musica {
        text-align: left;
        margin-top: 15px;
        padding: 10px;
        border-bottom: 1px solid #ccc;
    }

    @media (max-width: 768px) {
        .box {
            width: 90%;
        }
    }
</style>
</head>

<body>

<h1>Arsenal Music</h1>
<p>Catálogo musical para explorar artistas e canções</p>

<div class="box">
    <form id="form-musica">
        <input type="text" id="nome" placeholder="Nome da música"><br>
        <input type="text" id="artista" placeholder="Artista"><br>
        <input type="number" id="ano" placeholder="Ano"><br>

        <select id="genero">
            <option value="">Gênero</option>
            <option>MPB</option>
            <option>Sertanejo</option>
            <option>Forró</option>
            <option>Rock</option>
            <option>Pop</option>
        </select><br><br>

        <button type="submit">Pesquisar</button>
    </form>
</div>

<div class="box" id="resultado"></div>

<script>
    const form = document.getElementById("form-musica");
    const resultado = document.getElementById("resultado");

    const musicas = [
        {
            nome: "Evidências",
            artista: "Chitãozinho & Xororó",
            ano: 1990,
            genero: "Sertanejo",
            link: "https://www.letras.mus.br/chitaozinho-e-xororo/768469/significado.html"
        },
        {
            nome: "Samurai",
            artista: "Djavan",
            ano: 1982,
            genero: "MPB",
            link: "https://www.letras.mus.br/djavan/11342/significado.html"
        },
        {
            nome: "Asa Branca",
            artista: "Luiz Gonzaga",
            ano: 1947,
            genero: "Forró",
            link: "https://www.letras.mus.br/luiz-gonzaga/47081/significado.html"
        },
        {
            nome: "Alma de guerreiro",
            artista: "Seu jorge",
            ano: 2012,
            genero:"Samba//MPB",
            link:"https://www.letras.mus.br/seu-jorge/alma-de-guerreiro/significado.html",
        },
        {
            nome:"Construção",
            artista:"Chico Buarque",
            ano: 1971,
            genero:"MPB",
            link:"https://www.letras.mus.br/chico-buarque/45124/significado.html"
        },
        {
            nome:"Aquarela",
            artista:"Chico Buarque",
            ano: 1983,
            genero:"MPB",
            link:"https://www.letras.mus.br/toquinho/49095/significado.html"
        },
        {
            nome:"Feira de Mangaio",
            artista:"Sivuca",
            ano: 1979,
            genero:"Forró",
            link:"https://www.letras.mus.br/sivuca/765540/significado.html"
        },
    ];

    function mostrarMusicas(lista) {
        resultado.innerHTML = "";

        if (lista.length === 0) {
            resultado.innerHTML = "<p>Nenhuma música encontrada.</p>";
            return;
        }

        lista.forEach(musica => {
            resultado.innerHTML += `
                <div class="musica">
                    <strong>${musica.nome}</strong><br>
                    Artista: ${musica.artista}<br>
                    Ano: ${musica.ano}<br>
                    Gênero: ${musica.genero}<br>
                    <a href="${musica.link}" target="_blank">Ver significado</a>
                </div>
            `;
        });
    }

 
    mostrarMusicas(musicas);

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const nome = document.getElementById("nome").value.toLowerCase();
        const artista = document.getElementById("artista").value.toLowerCase();
        const ano = document.getElementById("ano").value;
        const genero = document.getElementById("genero").value;

        const filtradas = musicas.filter(musica =>
            (nome === "" || musica.nome.toLowerCase().includes(nome)) &&
            (artista === "" || musica.artista.toLowerCase().includes(artista)) &&
            (ano === "" || musica.ano == ano) &&
            (genero === "" || musica.genero === genero)
        );

        mostrarMusicas(filtradas);
    });
</script>

</body>
</html>
